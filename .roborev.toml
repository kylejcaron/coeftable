# Extra review instructions added to prompts for this repo.
review_guidelines = "coeftable renders publication-quality summary tables. Cells are pre-rendered\nHTML/SVG strings assembled from the caller's own dataframe and handed to\ngreat_tables. Frames are read via narwhals so pandas, polars, and pyarrow must\nall work — flag polars-only code paths.\n\nDocstring and comment accuracy.\n\nWhen a diff changes behavior, validation, or a code path, verify every\ndocstring and comment describing it still matches. Flag: (a) a reference to a\nguard, validation, parameter, or code path that does not exist or is no longer\nreached; (b) a guarantee the code does not enforce; (c) text left stale after a\nrename or removal; (d) a comment whose arithmetic or direction contradicts the\nconstant it explains. Do not flag prose style — only claims the current code\ncontradicts. This codebase uses numpydoc Parameters/Returns blocks throughout,\nso a renamed or retyped parameter usually leaves a stale block behind.\n\nTest-assertion liveness.\n\nFlag tests whose assertions cannot fail for the behavior the test names:\n- all() / any() over a possibly-empty sequence with no length assertion\n- assertions on inputs that never reach the branch under test (wrong dtype,\n  wrong selected rung or step, in-domain data in an out-of-domain test)\n- substring or attribute checks that also hold when the behavior is inverted\n- slices or regions that exclude the attribute being asserted\n- a value computed but never compared\nA regression test must fail when the fix under test is reverted. For SVG\nemitters, asserting a tag or attribute is merely present usually does not\ndistinguish correct geometry from wrong geometry — prefer assertions on\nprojected coordinates.\n\nNew-behavior coverage.\n\nEach new public parameter, new branch, or new cross-feature interaction needs at\nleast one test that exercises it and would fail if the new code were reverted.\nPrioritize the non-default path of a new flag, and the interaction of two\nnewly-combined features. Transitive coverage of a shared helper does not cover\nthe call-site wiring.\n\nUser-facing docs sync.\n\nWhen a diff changes a public API's default or signature, or removes a value\nfrom a Literal, check README and quickstart examples for stale references —\nespecially type-invalid literals in copy-pasteable examples, and prose\npromising output the new default no longer produces."
# Use repo review_guidelines instead of appending global review_guidelines.
review_guidelines_supersede_global = false
