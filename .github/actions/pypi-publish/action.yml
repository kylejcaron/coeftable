name: Publish to PyPI
description: >
  Download the built package artifact and publish it to PyPI via Trusted
  Publishing. Must be invoked from a top-level job, never a `uses:`-called
  reusable workflow -- PyPI Trusted Publishing does not support reusable
  workflows (https://github.com/pypa/gh-action-pypi-publish/issues/166). A
  composite action runs inside the caller's own job and does not get its
  own job_workflow_ref/Build Config URI claim, so extracting these steps
  here is safe and does not reintroduce that problem.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
