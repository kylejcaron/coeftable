name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version override (e.g. 1.2.3) -- takes precedence over bump"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          latest=$(git tag -l 'v*' --sort=-v:refname | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          latest="${latest:-0.0.0}"

          if [ -n "$VERSION_OVERRIDE" ]; then
            next="${VERSION_OVERRIDE#v}"
            if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version '$next' -- must be MAJOR.MINOR.PATCH"
              exit 1
            fi

            IFS='.' read -r next_major next_minor next_patch <<< "$next"
            IFS='.' read -r latest_major latest_minor latest_patch <<< "$latest"
            if [ "$((next_major * 1000000 + next_minor * 1000 + next_patch))" -le \
                 "$((latest_major * 1000000 + latest_minor * 1000 + latest_patch))" ]; then
              echo "::error::Explicit version '$next' is not greater than the latest release 'v$latest'"
              exit 1
            fi
          else
            IFS='.' read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              patch) next="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::Unknown bump type '$BUMP'"; exit 1 ;;
            esac
          fi

          tag="v${next}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          echo "Latest: v$latest -> Next: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes

  build:
    # Called reusably for the build step only: `publish.yml`'s own
    # `publish` job is gated on `startsWith(github.ref, 'refs/tags')`,
    # which is false here (`github.ref` reflects this run's own
    # branch/dispatch ref, not the `ref:` input below), so it no-ops --
    # only `build-package` executes.
    needs: tag
    uses: ./.github/workflows/publish.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
    with:
      ref: ${{ needs.tag.outputs.tag }}

  publish:
    # A real top-level job, not delegated via `uses:`: PyPI Trusted
    # Publishing does not support reusable workflows -- the OIDC
    # certificate's Build Config URI reflects the top-level caller
    # (release.yml) for a `uses:`-invoked job, which then fails to match
    # a Trusted Publisher entry registered for the *called* workflow.
    # See https://github.com/pypa/gh-action-pypi-publish/issues/166 and
    # the "Non-goals" section of that action's README: "keep the job
    # calling pypi-publish in a top-level [workflow]". `build-package`
    # itself has no such restriction and stays reusable above.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/p/coeftable
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  changelog:
    # Same reason as the publish job above: the release is created with the
    # workflow token, so its published event never reaches the changelog
    # workflow. Runs after the release exists, since the changelog is built
    # from the published release notes.
    needs: tag
    uses: ./.github/workflows/post-release.yml
    permissions:
      contents: write
      pull-requests: write
