name: Publish library

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the triggering ref."
        required: false
        type: string
      publish:
        description: "Upload the built package to PyPI."
        required: false
        default: false
        type: boolean

jobs:
  build-package:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The version is derived from the tag by hatch-vcs, so the build
          # must happen on the tag itself -- building the branch head would
          # produce a development version instead of the release version.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v2
        with:
          attest-build-provenance-github: true

  publish:
    runs-on: ubuntu-latest
    # A tag pushed by a workflow using the default token does not raise a
    # push event, so a release cut by automation must ask for the upload
    # explicitly rather than relying on the tag trigger below.
    if: >-
      inputs.publish ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags'))
    environment:
      name: publish
      url: https://pypi.org/p/coeftable
    needs: build-package
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
