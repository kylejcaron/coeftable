name: Publish library

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the triggering ref."
        required: false
        type: string
      publish:
        description: "Upload the built package to PyPI."
        required: false
        default: false
        type: boolean
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The version is derived from the tag by hatch-vcs, so the build
          # must happen on the tag itself -- building the branch head would
          # produce a development version instead of the release version.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v2
        with:
          attest-build-provenance-github: true

  publish:
    runs-on: ubuntu-latest
    # PyPI must have a trusted publisher registered for BOTH entry points,
    # each with environment "publish": this workflow, for a manual run or a
    # hand-pushed tag, and release.yml, for an automated release. Upload
    # authentication matches on the reusable workflow, but the build
    # provenance attestation carries the TOP-LEVEL workflow, so an automated
    # release presents release.yml and is rejected with "does not match
    # expected Trusted Publisher" unless that entry point is registered too.
    #
    # A tag pushed by a workflow using the default token does not raise a
    # push event, so a release cut by automation asks for the upload
    # explicitly. Any other run sitting on a tag -- a hand-pushed tag, or a
    # manual run selecting one, which is how a stranded release gets
    # published -- is also a release build. A run on a branch never is.
    if: inputs.publish || startsWith(github.ref, 'refs/tags')
    environment:
      name: publish
      url: https://pypi.org/p/coeftable
    needs: build-package
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
