name: Publish library

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the triggering ref."
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The version is derived from the tag by hatch-vcs, so the build
          # must happen on the tag itself -- building the branch head would
          # produce a development version instead of the release version.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v2
        with:
          attest-build-provenance-github: true

  publish:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing does not support reusable workflows
    # (https://github.com/pypa/gh-action-pypi-publish/issues/166): a
    # `workflow_call` invocation of this job would present the *caller's*
    # workflow identity, not this one, and fail to match the Trusted
    # Publisher entry registered for this workflow. So this job never
    # publishes when called reusably -- release.yml calls this workflow
    # for `build-package` only and does its own top-level publish. This
    # job runs only for a direct trigger of this workflow sitting on a
    # tag: a tag push, or a manual run selecting a tag ref (how a
    # stranded release gets republished). A run on a branch never does.
    if: startsWith(github.ref, 'refs/tags')
    environment:
      name: publish
      url: https://pypi.org/p/coeftable
    needs: build-package
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      # Must be invoked straight from the job, never via a local composite
      # action. This action builds a Docker trampoline whose image it names
      # from `github.action_repository`/`github.action_ref`, and both are
      # empty for an action nested inside another composite action
      # (actions/runner#2473). It then falls back to this repository and its
      # branch, and tries to pull an image that was never published.
      - uses: pypa/gh-action-pypi-publish@release/v1
