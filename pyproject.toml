[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coeftable"
version = "0.1.0"
description = "Publication-quality summary tables for estimates with uncertainty."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kyle Caron" }]
keywords = ["statistics", "tables", "forest-plot", "confidence-interval", "great-tables"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "great-tables>=0.22",
    "narwhals>=2.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.2",
    "polars>=1.0",
    "ruff>=0.15",
    "ty>=0.0.49",
    "prek>=0.4.5",
]

[project.urls]
Repository = "https://github.com/kylejcaron/coeftable"
Issues = "https://github.com/kylejcaron/coeftable/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/coeftable"]

[tool.uv]
default-groups = []

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 99
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "S", "UP", "W"]
ignore = ["RUF001", "RUF002", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=coeftable",
    "--cov-report=term-missing",
    "--no-cov-on-fail",
    "--color=yes",
]

[tool.coverage.run]
source = ["src/coeftable"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]
